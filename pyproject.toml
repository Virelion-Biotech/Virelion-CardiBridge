[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virelion-cardibridge"
version = "0.2.0"
description = "Contract-first interoperability protocol for the Virelion cardiac AI stack."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Virelion Biotech"}]
dependencies = ["pydantic>=2.7,<3", "jsonschema>=4.22,<5"]

[project.optional-dependencies]
server = ["fastapi>=0.111,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
cardibridge = "cardibridge.cli:main"

[tool.setuptools.packages.find]
include = ["cardibridge*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
