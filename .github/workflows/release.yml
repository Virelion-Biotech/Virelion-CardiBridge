name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build tooling
        run: python -m pip install --upgrade build
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          pyproject = Path('pyproject.toml').read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"$', pyproject, re.MULTILINE)
          if not match:
              raise SystemExit('project version not found')
          expected = f"v{match.group(1)}"
          actual = os.environ['TAG']
          if actual != expected:
              raise SystemExit(f'tag {actual!r} does not match project version {expected!r}')
          print(f'verified {actual}')
          PY
      - name: Build distributions
        run: python -m build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "Virelion-CardiBridge $TAG" --generate-notes
