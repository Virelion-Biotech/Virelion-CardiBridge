name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev,server]'
      - run: ruff check cardibridge tests
      - run: mypy cardibridge
      - run: pytest --cov=cardibridge --cov-report=term-missing
      - run: python -m build
      - run: python -m pip install dist/*.whl --force-reinstall
      - run: python -c "import cardibridge; print(cardibridge.__version__)"
