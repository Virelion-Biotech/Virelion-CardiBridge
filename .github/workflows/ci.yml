name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,server]' hypothesis
      - run: python -m pip check
      - run: python -m ruff check cardibridge tests ci
      - run: python -m mypy cardibridge
      - run: python -m pytest --cov=cardibridge --cov-report=term-missing --cov-fail-under=80
      - run: python -m build
      - run: python ci/validate_wheel.py

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,server]' pip-audit
      - run: python -m pip_audit

  asyncapi:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install .
      - run: npm ci --prefix ci --ignore-scripts --no-audit
      - run: python -m cardibridge.cli asyncapi --output asyncapi.json
      - run: node ci/validate_asyncapi.cjs asyncapi.json
